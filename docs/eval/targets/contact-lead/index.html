<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact the council</title><link rel="stylesheet" href="../base.css"></head>
<body>
<header><nav aria-label="Main"><a href="/" aria-current="page">Contact</a><a href="/inbox">Inbox</a></nav></header>
<main>
  <h1>Contact the council</h1>
  <p class="lede">Tell us what you need and we will give you a reference.</p>
  <form id="enquiry-form" method="post" action="/enquiry">
    <fieldset>
      <legend>Your enquiry</legend>
      <div><label for="name">Your name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
      <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div><label for="message">How can we help?</label><textarea id="message" name="message" rows="4" required></textarea></div>
      <div><button type="submit">Send enquiry</button></div>
    </fieldset>
  </form>
  <aside><h2>Other ways to reach us</h2><dl><dt>Phone</dt><dd>01234 567800</dd><dt>Opening hours</dt><dd>Monday to Friday, 8am to 6pm</dd></dl></aside>
</main>
<footer><p>We reply within three working days.</p></footer>
</body></html>
